[project]
name = "office-coding-agent-skill-evals"
version = "0.0.0"
description = "Skill engineering evals for Office Coding Agent host tool suites"
requires-python = ">=3.11"
dependencies = [
    "pytest-skill-engineering>=0.1.0",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests-aitest"]
asyncio_mode = "auto"
markers = [
    "integration: live LLM integration test",
    "excel: Excel host AI test",
    "powerpoint: PowerPoint host AI test",
    "word: Word host AI test",
    "outlook: Outlook host AI test",
    "token_efficiency: token efficiency experiment",
]
